name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --lib --bins --tests --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --doc --all-features

  dependency-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node scripts/lint-dependabot-policy.mjs
  dependency-validation:
    name: Dependency validation
    if: always() && github.event_name == 'pull_request'
    needs: ["test", "dependency-policy"]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: legra-ai/github-actions/.github/actions/require-ci-success@5b31798a4624366a3c0e3f331e41b8c55ccbfa53
        with:
          results: ${{ toJSON(needs) }}
